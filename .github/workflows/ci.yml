name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Test, and count what ran
        run: |
          set -o pipefail
          node --test --test-reporter=tap test/*.test.js | tee "$RUNNER_TEMP/tap.txt"
          n=$(sed -n 's/^# pass //p' "$RUNNER_TEMP/tap.txt")
          echo "tests passed: $n"
          test "${n:-0}" -ge 60
